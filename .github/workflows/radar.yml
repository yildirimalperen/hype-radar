name: Hype Radar tazeleme

on:
  schedule:
    # 2 günde bir, 06:17 UTC. Ayın tek günlerinde koşar; ay sonunda
    # 31->1 geçişinde bir günlük sapma olur, bu kabul edilebilir.
    - cron: '17 6 */2 * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Snapshot notu'
        required: false
        default: 'elle tetiklendi'

# Aynı anda iki tazeleme koşarsa snapshot commit'leri çakışır.
concurrency:
  group: hype-radar-refresh
  cancel-in-progress: false

permissions:
  contents: write   # snapshot dosyalarını repo'ya yazmak için
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Toplama: geçmiş snapshot'lar data/snapshots/ içinden DB'ye geri yüklenir,
      # yeni snapshot alınır ve yine oraya sıkıştırılmış olarak yazılır.
      - name: Chart taraması
        run: node src/collect.js "${{ github.event.inputs.note || 'zamanlanmış tazeleme' }}"

      - name: Skorla ve paneli derle
        run: node src/publish.js

      - name: Panel çıktısını hazırla
        run: |
          mkdir -p site
          cp web/dashboard.html site/index.html
          cp data/radar.json site/radar.json   # makine-okunur çıktı, ekip başka yerden tüketebilsin

      - name: Snapshot'ı repo'ya işle
        run: |
          git config user.name  "hype-radar[bot]"
          git config user.email "hype-radar@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "yeni snapshot yok, commit atlanıyor"
          else
            git commit -m "snapshot: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
