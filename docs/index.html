<title>Hype Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FCFBFA; --surface:#FFFFFF; --sunk:#F5F3F0; --ink:#16171B; --ink-2:#5B5D66;
  --ink-3:#9295A0; --line:#E8E5E0; --line-2:#D5D1CA;
  --heat:#C2255C; --heat-soft:#FBE4EC; --money:#0B7C8E; --money-soft:#E2F2F4;
  --good:#2B8A3E; --crit:#C92A2A;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --paper:#111216; --surface:#181A1E; --sunk:#1F2126; --ink:#EDEBE7; --ink-2:#A5A8B0;
  --ink-3:#6E717A; --line:#272A30; --line-2:#383C44;
  --heat:#F06595; --heat-soft:#34131E; --money:#3BC9DB; --money-soft:#0D2B30;
  --good:#51CF66; --crit:#FF6B6B;
}}
:root[data-theme="dark"]{
  --paper:#111216; --surface:#181A1E; --sunk:#1F2126; --ink:#EDEBE7; --ink-2:#A5A8B0;
  --ink-3:#6E717A; --line:#272A30; --line-2:#383C44;
  --heat:#F06595; --heat-soft:#34131E; --money:#3BC9DB; --money-soft:#0D2B30;
  --good:#51CF66; --crit:#FF6B6B;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:0 64px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
a{color:inherit}

/* başlık */
header{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--paper) 85%, transparent); backdrop-filter:blur(14px)}
.hd{max-width:1180px; margin:0 auto; padding:16px 20px 14px;
  display:flex; flex-wrap:wrap; gap:8px 22px; align-items:baseline}
.brand{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:19px; letter-spacing:-.025em}
.brand i{color:var(--heat); font-style:normal}
.hd .meta{margin-left:auto; color:var(--ink-3); font-size:12.5px;
  display:flex; flex-wrap:wrap; gap:4px 18px}
.hd .meta b{color:var(--ink-2); font-weight:500}

/* istatistik şeridi — kutu yok, sadece boşluk ve tipografi */
.stats{display:flex; flex-wrap:wrap; gap:26px 40px; padding:22px 0 24px;
  border-bottom:1px solid var(--line)}
.stat .n{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:27px;
  line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.stat .l{font-size:12px; color:var(--ink-3); margin-top:5px}
.stat.heat .n{color:var(--heat)}
.stat.money .n{color:var(--money)}

/* kontroller */
.bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:20px 0 14px}
.tabs{display:flex; gap:1px}
.tab{appearance:none; border:0; background:transparent; color:var(--ink-3); font:inherit;
  font-weight:500; font-size:13.5px; padding:6px 12px; border-radius:7px; cursor:pointer}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--ink); color:var(--paper)}
input[type="search"], select{font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-2); border-radius:8px; padding:7px 10px}
input[type="search"]{flex:1 1 180px; max-width:260px}
.chip{appearance:none; font:inherit; font-size:13px; font-weight:500; padding:6px 12px;
  border-radius:8px; border:1px solid var(--line-2); background:var(--surface);
  color:var(--ink-3); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
:is(.tab,.chip,input,select,.row,.store):focus-visible{outline:2px solid var(--heat); outline-offset:2px}

/* tablo — çerçeve yok, ince ayraçlar */
.list{container-type:inline-size}
.hrow,.row{display:grid; grid-template-columns:34px minmax(0,1fr) 112px 92px 108px 86px 44px;
  gap:14px; align-items:center; padding:11px 8px}
.hrow{font-size:11px; color:var(--ink-3); padding-block:8px; border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line); cursor:pointer; width:100%; text-align:left;
  font:inherit; color:inherit; background:none; border-left:0; border-right:0; border-top:0}
.row:hover{background:var(--sunk)}
.row.open{background:var(--sunk)}
.rank{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.row.open .rank, .rank.podium{color:var(--heat)}

.g{display:flex; gap:11px; align-items:center; min-width:0}
/* İkon: gerçek mağaza görseli üstte, yüklenemezse altındaki baş-harf karosu kalır. */
.ic{position:relative; width:34px; height:34px; flex:none}
.ic img{position:absolute; inset:0; width:100%; height:100%; border-radius:9px;
  object-fit:cover; background:var(--sunk)}
.tile{position:absolute; inset:0; border-radius:9px; display:grid; place-items:center;
  font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:12.5px;
  background:hsl(var(--h) 55% 94%); color:hsl(var(--h) 45% 34%)}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  .tile{background:hsl(var(--h) 28% 19%); color:hsl(var(--h) 60% 72%)}
}}
:root[data-theme="dark"] .tile{background:hsl(var(--h) 28% 19%); color:hsl(var(--h) 60% 72%)}
.g .txt{min-width:0}
.g .nm{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3}
.g .sub{font-size:12px; color:var(--ink-3); display:flex; gap:7px; align-items:center;
  min-width:0; line-height:1.4}
.g .pub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.store{font-size:11px; font-weight:500; text-decoration:none; color:var(--ink-3);
  white-space:nowrap; border-bottom:1px solid var(--line-2); padding-bottom:1px}
.store:hover{color:var(--heat); border-color:var(--heat)}
.store.play:hover{color:var(--money); border-color:var(--money)}
.age{font-size:11px; color:var(--ink-3); white-space:nowrap}

.hp{display:flex; align-items:center; gap:9px}
.hp .v{font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:16px;
  width:24px; font-variant-numeric:tabular-nums}
.hp .track{flex:1; height:3px; border-radius:2px; background:var(--line); min-width:20px}
.hp .track i{display:block; height:100%; border-radius:2px; background:var(--heat)}

.tag{font-size:11.5px; font-weight:500; white-space:nowrap}
.tag.breakout{color:var(--heat)}
.tag.rising{color:var(--money)}
.tag.established{color:var(--ink-2)}
.tag.watch{color:var(--ink-3)}

.cell{font-size:13px; font-variant-numeric:tabular-nums}
.cell .k{display:none}
.est{color:var(--ink-2)}
.est::before{content:"≈"; color:var(--ink-3); margin-right:1px}
.sub2{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px}
.up{color:var(--good); font-size:11.5px}
.r{text-align:right}

/* satır altı detay */
.det{border-bottom:1px solid var(--line); background:var(--sunk);
  padding:20px 8px 24px; display:grid; gap:28px;
  grid-template-columns:minmax(240px,1fr) minmax(260px,1fr) minmax(200px,.8fr)}
.det h4{margin:0 0 11px; font-size:12px; font-weight:600; color:var(--ink-3)}
.comp{display:grid; grid-template-columns:auto 1fr 30px; gap:7px 10px; align-items:center; font-size:12.5px}
.comp .track{height:3px; border-radius:2px; background:var(--line-2)}
.comp .track i{display:block; height:100%; border-radius:2px; background:var(--ink-2)}
.comp .n{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); text-align:right}
.comp .na{font-size:11px; color:var(--ink-3); text-align:right}
.kv{width:100%; border-collapse:collapse; font-size:12.5px}
.kv td{padding:5px 0; border-bottom:1px solid var(--line)}
.kv td:last-child{text-align:right; font-variant-numeric:tabular-nums}
.kv tr:last-child td{border-bottom:0}
.kv .miss{color:var(--ink-3)}
.ranks{width:100%; border-collapse:collapse; font-size:12.5px}
.ranks th{font-size:11px; font-weight:500; color:var(--ink-3); text-align:right; padding:0 0 6px}
.ranks th:first-child{text-align:left}
.ranks td{padding:4px 0; text-align:right; font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line)}
.ranks td:first-child{text-align:left}
.ranks tr:last-child td{border-bottom:0}
.ranks .miss{color:var(--ink-3)}
.links{display:flex; gap:14px; margin-top:14px}
.links a{font-size:12.5px; font-weight:500; text-decoration:none; color:var(--heat)}
.links a:hover{text-decoration:underline}

/* yöntem */
.method{margin-top:36px; border-top:1px solid var(--line); padding-top:18px}
.method summary{cursor:pointer; font-weight:600; font-size:14px; color:var(--ink-2)}
.method summary:hover{color:var(--ink)}
.method .body{margin-top:16px; display:grid; gap:26px;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); color:var(--ink-2); font-size:13px}
.method h5{margin:0 0 7px; font-size:12px; font-weight:600; color:var(--ink-3)}
.method ul{margin:0; padding-left:16px} .method li{margin-bottom:4px}
.method code{font-family:"IBM Plex Mono",monospace; font-size:11.5px}
.empty{padding:44px 8px; text-align:center; color:var(--ink-3)}
footer{margin-top:28px; color:var(--ink-3); font-size:12px}

@container (max-width:720px){
  .hrow{display:none}
  .row{display:flex; flex-wrap:wrap; align-items:center; gap:5px 14px; padding:13px 8px}
  .row .rank{flex:0 0 22px}
  .row .g{flex:1 1 200px}
  .row .c-hp{flex:1 0 100%; max-width:200px}
  .row .c-dl,.row .c-rev,.row .c-tag,.row .c-cty{flex:0 0 auto}
  .cell .k{display:inline; font-size:11px; color:var(--ink-3); margin-right:4px}
  .sub2{display:inline; margin-left:6px}
  .r{text-align:left}
}
@media (max-width:760px){ .det{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

6","title":"열혈강호: 넥스트","publisher":"Kingnet Technology Limited","icon":"https://play-lh.googleusercontent.com/ct9hCP6C7NRwwTT3p-eIRLAJHMYuK2k2kO0tC6nc8YUCwgRos5tOuzfKmflfPOwQdfJiuNHkmifu0lhVcEmY","genres":["Role Playing"],"releasedAt":null,"ageDays":null,"hype":37,"tier":"established","components":{"rankMomentum":null,"downloadVelocity":null,"lifetimeVelocity":null,"breadth":0.48,"newEntry":0,"monetization":0.94,"youth":null},"coverage":0.34,"platforms":{"ios":null,"android":{"id":"com.rxjhglkr.gp","url":"https://play.google.com/store/apps/details?id=com.rxjhglkr.gp&hl=en&gl=us","rating":null,"ratingCount":null,"hype":37}},"ranks":{"kr":{"grossing":12}},"countryCount":1,"bestGross":12,"bestFree":null,"downloads":{"androidTotal":337769,"iosTotalEstimate":null,"total":337769,"windowDelta":null,"source":"mixed"},"revenueDailyEstimate":80084,"iapRange":null}],"embedded":true,"totalGames":1507,"summary":{"breakout":2,"rising":142,"established":82,"crossPlatform":391,"revenueDaily":82855165,"measuredInstalls":58606835560}}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('radar-data').textContent);
  const G = DATA.games;
  const MONTH = 30.44;

  const COMPONENTS = {
    rankMomentum:     ['Sıra ivmesi', 'Pencere içinde chart sırasındaki log-ölçekli hareket'],
    downloadVelocity: ['İndirme hızı', 'Pencere içinde günlük indirme/değerlendirme artışı'],
    lifetimeVelocity: ['Yaşam boyu hız', 'Çıkıştan bu yana günlük ortalama indirme'],
    breadth:          ['Ülke yayılımı', 'Kaç ülkede, hangi pazar ağırlığıyla chart’ta'],
    newEntry:         ['Yeni giriş', 'Chart’a bu turda ilk kez girdiği ülke oranı'],
    monetization:     ['Para kazanma', 'Hasılat sırasının ücretsiz sırasına üstünlüğü'],
    youth:            ['Yaş', 'Çıkışından bu yana geçen süre'],
  };
  const TIERS = { breakout:'Patlama', rising:'Yükselen', established:'Zirve', watch:'İzlemede' };

  const nf = new Intl.NumberFormat('tr-TR');
  const num = (n) => {
    if (n === null || n === undefined) return null;
    if (n >= 1e9) return (n/1e9).toFixed(n>=1e10?0:1) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1) + 'M';
    if (n >= 1e3) return Math.round(n/1e3) + 'k';
    return nf.format(n);
  };
  const usd = (n) => {
    if (!n) return null;
    if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n/1e6).toFixed(n>=1e8?0:1) + 'M';
    if (n >= 1e3) return '$' + Math.round(n/1e3) + 'k';
    return '$' + Math.round(n);
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Yaş: 30 günden genç oyunlarda gün anlamlı, sonrasında ay okunur kalıyor.
  const age = (d) => d === null || d === undefined ? null
    : (d < 30 ? d + 'd' : Math.round(d / MONTH) + 'm');

  /**
   * İkon URL'ini 68px'e indirger. Ham hâli kullanılamaz: Play ikonu 360 KB,
   * 250 satırda 90 MB eder. Küçültülmüş hâlleri ~5-9 KB.
   *   Apple: yolun sonundaki  /100x100bb.jpg  ->  /68x68bb.webp
   *   Play : URL sonuna       =s68-rw
   */
  const ICON_PX = 68;
  const iconUrl = (u) => {
    if (!u) return null;
    if (u.includes('mzstatic.com')) return u.replace(/\/\d+x\d+[a-z]*\.(jpg|png|webp)$/i, `/${ICON_PX}x${ICON_PX}bb.webp`);
    if (u.includes('googleusercontent.com')) return u.split('=')[0] + `=s${ICON_PX}-rw`;
    return u;
  };

  // İkon yüklenemezse (ölü URL, engelli ağ) başlıktan üretilen renkli karo görünür.
  const initials = (title) => {
    const t = String(title ?? '?');
    let h = 0;
    for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
    const ini = t.replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/)
      .slice(0, 2).map((w) => w[0]).join('').toLocaleUpperCase('tr') || '?';
    return { hue: h % 360, ini };
  };
  const tile = (g) => {
    const { hue, ini } = initials(typeof g === 'string' ? g : g.title);
    const url = typeof g === 'string' ? null : iconUrl(g.icon);
    return `<span class="ic" style="--h:${hue}">
      <span class="tile" aria-hidden="true">${esc(ini)}</span>
      ${url ? `<img src="${esc(url)}" alt="" loading="lazy" decoding="async"
                   width="${ICON_PX / 2}" height="${ICON_PX / 2}" onerror="this.remove()">` : ''}
    </span>`;
  };

  const state = { view:'hype', q:'', country:'', ios:false, android:false, sort:'hype', open:null };
  try {
    const s = JSON.parse(localStorage.getItem('hypeRadar') || '{}');
    Object.assign(state, { view:s.view ?? 'hype', country:s.country ?? '', sort:s.sort ?? 'hype' });
  } catch {}
  const save = () => { try {
    localStorage.setItem('hypeRadar', JSON.stringify({ view:state.view, country:state.country, sort:state.sort }));
  } catch {} };

  // --- üst bilgi ---
  const when = new Intl.DateTimeFormat('tr-TR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
  document.getElementById('meta').innerHTML = [
    `<b>${esc(when.format(new Date(DATA.takenAt)))}</b> taraması`,
    DATA.coldStart ? 'ivme sinyalleri sonraki turda'
                   : `<b>${String(DATA.windowDays).replace('.', ',')} gün</b>lük pencere`,
    `<b>${DATA.totalGames ?? DATA.counts.games}</b> oyun · <b>${DATA.countries.length}</b> ülke · 2 mağaza`,
  ].join('<span aria-hidden="true" style="color:var(--line-2)">/</span>');

  // --- istatistikler ---
  const S = DATA.summary ?? {};
  const stat = (n, l, cls = '') => `<div class="stat ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  document.getElementById('stats').innerHTML =
    stat(S.breakout ?? 0, 'patlama', 'heat') +
    stat(S.rising ?? 0, 'yükselen') +
    stat(S.established ?? 0, 'zirvede') +
    stat(S.crossPlatform ?? 0, 'iki mağazada') +
    stat(usd((S.revenueDaily ?? 0) * MONTH) ?? '—', 'aylık net IAP · tahmin', 'money') +
    stat(num(S.measuredInstalls ?? 0) ?? '—', 'ölçülen kurulum');

  const cSel = document.getElementById('country');
  cSel.innerHTML = '<option value="">Tüm ülkeler</option>' +
    DATA.countries.map((c) => `<option value="${c.code}">${esc(c.label)}</option>`).join('');
  cSel.value = state.country;
  document.getElementById('sort').value = state.sort;

  // --- filtre ---
  const byGross = (a, b) => (a.bestGross ?? 1e9) - (b.bestGross ?? 1e9);
  function visible() {
    let r = G.slice();
    if (state.view === 'breakout') r = r.filter((g) => g.tier === 'breakout');
    if (state.view === 'grossing') r = r.filter((g) => g.bestGross !== null);
    if (state.view === 'new') r = r.filter((g) => g.ageDays !== null && g.ageDays <= 120);
    if (state.country) r = r.filter((g) => g.ranks[state.country]);
    if (state.ios) r = r.filter((g) => g.platforms.ios);
    if (state.android) r = r.filter((g) => g.platforms.android);
    if (state.q) {
      const q = state.q.toLocaleLowerCase('tr');
      r = r.filter((g) => (g.title || '').toLocaleLowerCase('tr').includes(q) ||
                          (g.publisher || '').toLocaleLowerCase('tr').includes(q));
    }
    const cmp = {
      hype:      (a, b) => b.hype - a.hype,
      downloads: (a, b) => (b.downloads.total || 0) - (a.downloads.total || 0),
      revenue:   (a, b) => (b.revenueDailyEstimate || 0) - (a.revenueDailyEstimate || 0),
      new:       (a, b) => (a.ageDays ?? 1e9) - (b.ageDays ?? 1e9),
      gross:     byGross,
    }[state.sort];
    return r.sort(state.view === 'grossing' && state.sort === 'hype' ? byGross : cmp);
  }

  // --- satır ---
  function rowHtml(g, i) {
    const dl = g.downloads.total;
    const measured = g.downloads.androidTotal !== null && !g.platforms.ios;
    const rev = g.revenueDailyEstimate;
    const p = g.platforms;
    return `
      <div class="row${state.open === g.key ? ' open' : ''}" data-key="${g.key}"
           role="button" tabindex="0" aria-expanded="${state.open === g.key}">
        <span class="rank${i < 3 ? ' podium' : ''}">${i + 1}</span>
        <span class="g">
          ${tile(g)}
          <span class="txt">
            <span class="nm">${esc(g.title)}</span>
            <span class="sub">
              <span class="pub">${esc(g.publisher || '')}</span>
              ${p.ios?.url ? `<a class="store" href="${esc(p.ios.url)}" target="_blank" rel="noopener">App Store</a>` : ''}
              ${p.android?.url ? `<a class="store play" href="${esc(p.android.url)}" target="_blank" rel="noopener">Play</a>` : ''}
              ${g.ageDays !== null ? `<span class="age mono" title="Çıkışından bu yana ${g.ageDays} gün">${age(g.ageDays)}</span>` : ''}
            </span>
          </span>
        </span>
        <span class="cell c-hp hp">
          <span class="v"${g.hype >= 60 ? ' style="color:var(--heat)"' : ''}>${Math.round(g.hype)}</span>
          <span class="track"><i style="width:${Math.max(3, Math.min(100, g.hype))}%"></i></span>
        </span>
        <span class="cell c-dl r">
          <span class="k">indirme</span>
          ${dl ? `<span class="${measured ? '' : 'est'}">${num(dl)}</span>` : '<span class="miss">—</span>'}
          ${g.downloads.windowDelta ? `<span class="sub2 up">+${num(g.downloads.windowDelta)}</span>` : ''}
        </span>
        <span class="cell c-rev r">
          <span class="k">net IAP</span>
          ${rev ? `<span class="est" title="Hasılat sırasından modellenmiş net IAP tahmini; belirsizlik en az ±%40">${usd(rev)}</span>
                   <span class="sub2">${usd(rev * MONTH)}/ay</span>`
                : '<span class="miss">—</span>'}
        </span>
        <span class="cell c-tag"><span class="tag ${g.tier}">${TIERS[g.tier]}</span></span>
        <span class="cell c-cty r mono" title="Chart'ta olduğu ülke sayısı">${g.countryCount}</span>
      </div>
      ${state.open === g.key ? detail(g) : ''}`;
  }

  function detail(g) {
    const comps = Object.entries(COMPONENTS).map(([k, [label, desc]]) => {
      const v = g.components[k];
      return `<span title="${esc(desc)}">${esc(label)}</span>
        <span class="track">${v === null ? '' : `<i style="width:${Math.round(v * 100)}%"></i>`}</span>
        ${v === null ? '<span class="na">yok</span>' : `<span class="n">${Math.round(v * 100)}</span>`}`;
    }).join('');

    const rows = DATA.countries.filter((c) => g.ranks[c.code]).map((c) => {
      const r = g.ranks[c.code];
      const td = (x) => x ? `<td>#${x}</td>` : '<td class="miss">—</td>';
      return `<tr><td>${esc(c.label)}</td>${td(r.free)}${td(r.grossing)}${td(r.new)}</tr>`;
    }).join('');

    const p = g.platforms;
    const rate = (s) => s?.rating ? `${s.rating.toFixed(2).replace('.', ',')} · ${num(s.ratingCount)}` : '<span class="miss">—</span>';
    return `<div class="det">
      <div>
        <h4>Skor kırılımı · kapsam %${Math.round(g.coverage * 100)}</h4>
        <div class="comp">${comps}</div>
      </div>
      <div>
        <h4>Mağaza verisi</h4>
        <table class="kv"><tbody>
          <tr><td>Play kurulum (ölçüm)</td><td>${num(g.downloads.androidTotal) ?? '<span class="miss">—</span>'}</td></tr>
          <tr><td>iOS indirme (tahmin)</td><td class="est">${num(g.downloads.iosTotalEstimate) ?? '<span class="miss">—</span>'}</td></tr>
          <tr><td>Net IAP (tahmin)</td><td class="est">${rev0(g)}</td></tr>
          <tr><td>IAP aralığı</td><td>${esc(g.iapRange || '—')}</td></tr>
          <tr><td>iOS puan</td><td>${rate(p.ios)}</td></tr>
          <tr><td>Android puan</td><td>${rate(p.android)}</td></tr>
          <tr><td>Çıkış</td><td>${g.releasedAt ? esc(new Date(g.releasedAt).toLocaleDateString('tr-TR')) : '<span class="miss">—</span>'}</td></tr>
          <tr><td>Tür</td><td>${esc((g.genres || []).filter((x) => x !== 'Games').join(', ') || '—')}</td></tr>
        </tbody></table>
        <div class="links">
          ${p.ios?.url ? `<a href="${esc(p.ios.url)}" target="_blank" rel="noopener">App Store ↗</a>` : ''}
          ${p.android?.url ? `<a href="${esc(p.android.url)}" target="_blank" rel="noopener">Google Play ↗</a>` : ''}
        </div>
      </div>
      <div>
        <h4>Ülke bazında sıra</h4>
        <table class="ranks">
          <thead><tr><th>Ülke</th><th>Ücretsiz</th><th>Hasılat</th><th>Yeni</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }
  const rev0 = (g) => g.revenueDailyEstimate
    ? `${usd(g.revenueDailyEstimate)}/gün · ${usd(g.revenueDailyEstimate * MONTH)}/ay`
    : '<span class="miss">—</span>';

  function render() {
    const rows = visible();
    const list = document.getElementById('list');
    if (!rows.length) { list.innerHTML = '<div class="empty">Bu filtrelerle eşleşen oyun yok.</div>'; return; }
    list.innerHTML =
      `<div class="hrow">
        <span></span><span>Oyun</span><span>Hype</span><span class="r">İndirme</span>
        <span class="r">Net IAP</span><span>Kademe</span><span class="r">Ülke</span>
      </div>` + rows.slice(0, 250).map(rowHtml).join('') +
      (rows.length > 250 ? `<div class="empty">${rows.length - 250} oyun daha — aramayla daraltın.</div>` : '');
  }

  // --- olaylar ---
  const list = document.getElementById('list');
  const toggle = (key) => { state.open = state.open === key ? null : key; render(); };
  list.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;          // mağaza linkleri satırı açmasın
    const row = e.target.closest('.row');
    if (row) toggle(row.dataset.key);
  });
  list.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.row');
    if (!row || e.target.closest('a')) return;
    e.preventDefault(); toggle(row.dataset.key);
  });
  document.getElementById('tabs').addEventListener('click', (e) => {
    const t = e.target.closest('.tab'); if (!t) return;
    state.view = t.dataset.view; state.open = null;
    document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === t)));
    save(); render();
  });
  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  cSel.addEventListener('change', (e) => { state.country = e.target.value; save(); render(); });
  document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; save(); render(); });
  for (const [id, key] of [['fIos', 'ios'], ['fAnd', 'android']]) {
    document.getElementById(id).addEventListener('click', (e) => {
      state[key] = !state[key];
      e.currentTarget.setAttribute('aria-pressed', String(state[key]));
      render();
    });
  }
  document.querySelectorAll('.tab').forEach((x) =>
    x.setAttribute('aria-selected', String(x.dataset.view === state.view)));

  // --- yöntem ---
  document.getElementById('methodBody').innerHTML = `
    <div>
      <h5>Bileşenler</h5>
      <ul>${Object.entries(DATA.weights || {}).map(([k, w]) =>
        `<li><b>${esc(COMPONENTS[k]?.[0] ?? k)}</b> %${Math.round(w * 100)} — ${esc(COMPONENTS[k]?.[1] ?? '')}</li>`).join('')}</ul>
      <p>Her bileşen kohort içi yüzdelik sıraya çevrilir; ölçülemeyenin ağırlığı kalanlara dağıtılır
      ve satır kapsam oranıyla cezalandırılır.</p>
    </div>
    <div>
      <h5>Ölçülen</h5>
      <ul>${DATA.methodology.measured.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h5 style="margin-top:14px">Tahmin</h5>
      <ul>${DATA.methodology.estimated.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
    </div>
    <div>
      <h5>Gelir modeli</h5>
      <p>${esc(DATA.methodology.note)}</p>
      ${DATA.methodology.revenueCalibration ? `<p><b>${DATA.methodology.revenueCalibration.anchors}</b>
        sektör tahminine kalibre (${esc(DATA.methodology.revenueCalibration.period)}): medyan oran
        <b>${String(DATA.methodology.revenueCalibration.medianRatio).replace('.', ',')}×</b>,
        ${esc(DATA.methodology.revenueCalibration.within2x)} çapa 2 kat içinde.</p>` : ''}
      <h5 style="margin-top:14px">Kalibrasyon</h5>
      <p>iOS indirme tahmini sabit katsayı değil: her taramada eşleşmiş
      <b>${DATA.calibration.pairs}</b> oyundan medyan oran hesaplanıyor —
      bu turda 1 değerlendirme ≈ <b>${String(DATA.calibration.installsPerRating).replace('.', ',')}</b> indirme.</p>
    </div>`;

  document.getElementById('foot').textContent =
    `Snapshot #${DATA.snapshotId} · bu sayfada ${DATA.games.length} oyun` +
    (DATA.totalGames ? ` (taranan ${DATA.totalGames} oyunun üst kısmı)` : '') +
    ` · App Store RSS + iTunes Lookup, Google Play · 2 günde bir yenilenir`;

  render();
})();
</script>
